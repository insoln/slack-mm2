services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slack-mm}
      POSTGRES_USER: ${POSTGRES_USER:-slack-mm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slack-mm}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slack-mm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - core

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command:
      - sh
      - -c
      - |
        alembic upgrade head && \
        uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./.env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://slack-mm:slack-mm@postgres:5432/slack-mm}
      EXPORT_WORKERS: ${EXPORT_WORKERS:-5}
      ATTACHMENT_WORKERS: ${ATTACHMENT_WORKERS:-3}
      ALEMBIC_INI: /app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_HTTP_PORT:-8000}:8000"
    restart: unless-stopped
    # NOTE: Image already uses Tini as ENTRYPOINT. Avoid a second init layer to prevent
    # duplicate non-PID1 Tini warnings and redundant process.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthcheck')
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - core

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - core

volumes:
  db_data:

networks:
  core:
    driver: bridge