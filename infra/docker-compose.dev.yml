services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: slack-mm
      POSTGRES_USER: slack-mm
      POSTGRES_PASSWORD: slack-mm
    ports:
      - "5432:5432"
    volumes:
      - ./db/init-mattermost.sql:/docker-entrypoint-initdb.d/init-mattermost.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slack-mm"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "${UVICORN_LOG_LEVEL:-info}", "--access-log"]
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 5s
    # Предотвращение осиротевших процессов
    security_opt:
      - no-new-privileges:true
    # Принудительное завершение при остановке
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    env_file:
      - .env.dev
    environment:
      DATABASE_URL: postgresql+asyncpg://slack-mm:slack-mm@db:5432/slack-mm
      BACKEND_HOST: localhost
      BACKEND_PORT: 8000
      LOG_LEVEL: DEBUG
      UVICORN_LOG_LEVEL: DEBUG
      HTTPX_LOG_LEVEL: DEBUG
      MM_URL: http://mattermost:8065
      MM_TOKEN: 5x7rr788c7gwdnkdr9imb49ffo
      MM_TEAM: test
      # Remote bundle fetch (dev): point to latest published tarball served by test-files
      PLUGIN_BUNDLE_URL: http://test-files:9000/plugin-bundles/latest.tar.gz
      EXPORT_WORKERS: 5
      # HTTP client pooling
      MM_MAX_KEEPALIVE: 50
      MM_MAX_CONNECTIONS: 200
      MM_HTTP2: "1"
      # DB pool tuning for high concurrency
      DB_POOL_SIZE: 20
      DB_MAX_OVERFLOW: 40
      DB_POOL_TIMEOUT: 60
      # Attachment concurrency and limits
      ATTACHMENT_WORKERS: 5
      # Allow attachments whose url_private begins with any of these prefixes (CSV). Include test-files fixture host for CI integration dataset.
      IMPORT_URL_PREFIXES: "https://files.slack.com,http://test-files:9000"
      SLACK_VERIFICATION_TOKEN: ${SLACK_VERIFICATION_TOKEN}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
    depends_on:
      db:
        condition: service_healthy
      plugin-autobuild:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ../alembic.ini:/alembic.ini
      - ../backend/app:/app/app
      - ../backend/alembic:/app/backend/alembic
      - ./plugin:/app/infra/plugin:ro
      # Separate mount for built bundles (do not override source dist directory)
      - ./test-data/plugin-bundles:/plugin-bundles:ro
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    # Install deps each start (ensures clean, deterministic dev env) then start Vite
    command: ["sh", "-lc", "npm ci && npx vite --host 0.0.0.0"]
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 5s
    # Предотвращение осиротевших процессов
    security_opt:
      - no-new-privileges:true
    # Принудительное завершение при остановке
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    restart: unless-stopped

  test-files:
    image: python:3.12-slim
    command: ["python", "-m", "http.server", "9000"]
    working_dir: /data
    volumes:
      - ./test-data:/data:ro
      - ./test-data/plugin-bundles:/data/plugin-bundles:ro
    ports:
      - "9000:9000"
    restart: unless-stopped

  # Автосборка плагина только если артефакт отсутствует в plugin-bundles.
  plugin-autobuild:
    # Use golang base (smaller total installs: go preinstalled; add node only if webapp present)
    image: golang:1.22-alpine
    working_dir: /repo
    # Direct command invocation (no nested login shell) to avoid swallowing the script execution
    command: ["/bin/sh", "-c", "sh infra/plugin/build-if-missing.sh"]
    volumes:
      # Mount project root (compose file is in infra/, so .. is repo root)
      - ..:/repo:ro
      # Writable output directory served by test-files
      - ./test-data/plugin-bundles:/out
    depends_on:
      - test-files
    restart: "no"

  mattermost:
    image: mattermost/mattermost-team-edition:release-10
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    environment:
      - MM_CONFIG=/mattermost/config/mm_config.json
    ports:
      - "8065:8065"
    volumes:
      - mm_config:/mattermost/config
    depends_on:
      db:
        condition: service_started
      mm-config-init:
        condition: service_completed_successfully

  # Одноразовый инициализатор конфигурации Mattermost: копирует seed и выставляет права
  mm-config-init:
    image: alpine:3.20
    user: "0:0"
    command: ["/bin/sh", "-lc", "set -e; mkdir -p /config; if [ ! -f /config/mm_config.json ]; then cp /seed/mm_config.json /config/mm_config.json; fi; chown -R 2000:2000 /config"]
    volumes:
      - mm_config:/config
      - ./mattermost/mm_config.json:/seed/mm_config.json:ro
    restart: "no"


volumes:
  frontend_node_modules:
  mm_config: