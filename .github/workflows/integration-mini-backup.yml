name: E2E Integration Test (Mini Backup)

on:
  pull_request:
    branches: [ master ]

jobs:
  mini-backup-test:
    name: "E2E: Mini Backup Import"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Show disk usage before
        run: df -h

      - name: Build images (backend + frontend + plugin base) & start services
        run: |
          docker compose -f infra/docker-compose.dev.yml build db backend mattermost test-files

      - name: Build plugin (multi-stage Docker)
        run: |
          bash infra/plugin/build-docker.sh
          ls -l infra/plugin/dist || (echo 'Plugin dist missing after build' && exit 1)

      - name: Run mini backup integration script
        run: |
          chmod +x scripts/run_mini_backup_integration.sh
          ./scripts/run_mini_backup_integration.sh

      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: tmp/integration_backend.log
          if-no-files-found: warn

      - name: Show disk usage after
        if: always()
        run: df -h
